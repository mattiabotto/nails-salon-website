<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/e270a58a6a.js" crossorigin="anonymous"></script>
  <script src="./script/script.js" defer></script>
  <title>Nails by Alice</title>
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <img src="./img/logo.svg" alt="Logo se dvěma zkříženýma rukama a červeně nalakovanými nehty" width="64" height="64">
      </div>
      
      <div class="nav-links">
        <ul>
          <li><a href="">O mně</a></li>
          <li><a href="">Ceník</a></li>
          <li><a href="">Kontakt</a></li>
          <li><a href="" class="reserve-button">Rezervovat (Notino)</a></li>
        </ul>
      </div>
    </nav>

    <div class="hero-content">
      <h1>Nails by Alice</h1>
      <h2>Manikúra a pedikúra</h2>
      <p>Krásné nehty nejsou jen o vzhledu, ale i o pocitu, který vám dodají.</p>

      <a href="" class="reserve-button">Rezervovat termin (Notino)</a>
    </div>
  </header>

  <main>
    <section class="gallery">
      <h2 class="gallery-title">Moje práce</h2>

      <div class="slider-wrapper">
        <button class="nav-btn prev-btn" id="prevBtn">❮</button>
        
        <div class="image-slider-frame">
          <div class="image-track"></div>
        </div>
        
        <button class="nav-btn next-btn" id="nextBtn">❯</button>
      </div>

      <div class="dots-container"></div>
    </section>

    <section class="services">
      <h2>Služby</h2>
      <ul>
        <li>
          <img src="./img/manicure.png" alt="Manicure icon" width="100px" height="100px">
          <p>Manicure</p>
        </li>
        <li>
          <img src="./img/pedicure.png" alt="Pedicure icon" width="100px" height="100px">
          <p>Pedicure</p>
        </li>
        <li>
          <img src="./img/manicure.png" alt="Manicure icon" width="100px" height="100px">
          <p>Manicure</p>
        </li>
        <li>
          <img src="./img/pedicure.png" alt="Pedicure icon" width="100px" height="100px">
          <p>Pedicure</p>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <div class="left">
      <div class="logo">
          <img src="./img/logo.svg" alt="Logo se dvěma zkříženýma rukama a červeně nalakovanými nehty" width="64" height="64">
      </div>
      <h2>Nails by Alice</h2>
    </div>

    <div class="right">
      <p>Sledujte mě</p>
      <a href="https://www.instagram.com/nailsbyalice_kv" target="_blank" aria-label="Instagram">
        <i class="fa-brands fa-instagram fa-2xl"></i>
      </a> 
      <a href="https://www.facebook.com/profile.php?id=61579007579081" target="_blank" aria-label="Facebook">
        <i class="fa-brands fa-square-facebook fa-2xl"></i>
      </a>
    </div>
  </footer>
</body>
</html>
